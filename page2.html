<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question 2 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)), url('2.jpg') no-repeat center center/cover;
      overflow: hidden;
      position: relative;
    }
    .heart-fall {
      position: absolute;
      top: -30px;
      font-size: 18px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
      z-index: 1;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.1; }
    }
    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .card h1 {
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      font-size: 24px;
      margin: 20px 0 30px;
      line-height: 1.4;
    }
    .btn-wrap {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      min-height: 60px;
    }
    button {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s;
    }
    .yes-btn {
      background: #845ef7;
      color: white;
      box-shadow: 0 4px 15px rgba(132, 94, 247, 0.4);
    }
    .yes-btn:hover { transform: scale(1.1); }
    .no-btn {
      background: rgba(255, 255, 255, 0.7);
      color: #333;
      position: absolute;
    }
  </style>
</head>
<body>

  <div class="card">
    <div style="font-size: 55px;">🥺</div>
    <h1>Do you promise to always buy me snacks and cuddle me?</h1>
    <div class="btn-wrap">
      <button class="yes-btn" onclick="location.href='page3.html'">I Promise! 💖</button>
      <button class="no-btn" id="noBtn" onmouseover="moveButton()">Nope 🙄</button>
    </div>
  </div>

  <script>
    function spawnHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart-fall');
      heart.innerText = ['❤️', '💖', '💕', '💗', '✨'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 14 + 14) + 'px';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(spawnHeart, 250);

    function moveButton() {
      const btn = document.getElementById('noBtn');
      const randomX = Math.floor(Math.random() * 260) - 130;
      const randomY = Math.floor(Math.random() * 200) - 100;
      btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }
  </script>
</body>
</html>
