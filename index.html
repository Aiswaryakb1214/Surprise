<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A Question For You ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffafbd, #ffc3a0);
      overflow: hidden;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 90%;
    }
    h1 { color: #d6336c; font-size: 24px; margin-bottom: 25px; }
    .btn-wrap {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      position: relative;
      min-height: 60px;
    }
    button {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .yes-btn { background-color: #ff4d6d; color: white; }
    .yes-btn:hover { transform: scale(1.1); }
    .no-btn {
      background-color: #ced4da;
      color: #495057;
      position: absolute;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 50px;">💌</div>
    <h1>Hey handsome, do you have a minute for me?</h1>
    <div class="btn-wrap">
      <button class="yes-btn" onclick="location.href='page2.html'">Yes 💕</button>
      <button class="no-btn" id="noBtn" onmouseover="moveButton()">No 😜</button>
    </div>
  </div>

  <script>
    function moveButton() {
      const btn = document.getElementById('noBtn');
      const randomX = Math.floor(Math.random() * 260) - 130;
      const randomY = Math.floor(Math.random() * 200) - 100;
      btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }
  </script>
</body>
</html>
