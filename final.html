<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I Knew It! ❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fecfef);
      overflow: hidden;
      text-align: center;
      position: relative;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 420px;
      width: 85%;
      z-index: 2;
    }
    h1 { color: #d6336c; font-size: 26px; margin: 10px 0; }
    p { color: #555; font-size: 16px; line-height: 1.5; }
    img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 50%;
      border: 5px solid #ff4d6d;
      margin: 15px 0;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }
    /* Floating hearts animation */
    .heart {
      position: absolute;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp 5s linear infinite;
      z-index: 1;
      opacity: 0.8;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-100vh) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>YAY! You said YES! 🎉❤️</h1>
    <img src="our-photo.jpg" alt="Our Photo">
    <p>I knew you couldn't resist! Best boyfriend in the whole world. I love you so much! 💕</p>
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerText = ['❤️', '💖', '✨', '🥰', '💕'][Math.floor(Math.random() * 5)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }
    setInterval(createHeart, 300);
  </script>
</body>
</html>
